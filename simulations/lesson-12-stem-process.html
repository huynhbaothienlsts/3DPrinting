<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 12 - Quy trình tư duy thiết kế STEM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#f8fafc}body{display:flex;justify-content:center;padding:17px}.game{width:min(960px,100%);padding:22px;border:1px solid #334155;border-radius:13px;background:#1e293b;box-shadow:0 10px 30px rgba(0,0,0,.3)}h1{text-align:center;margin:0 0 5px;color:#38bdf8;font-size:21px;text-transform:uppercase}.subtitle{text-align:center;margin:0 0 20px;color:#94a3b8;font-size:13px}.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:20px}.slot{min-height:100px;display:flex;flex-direction:column;align-items:center;padding:6px;border:2px dashed #475569;border-radius:8px;background:rgba(15,23,42,.62);transition:.17s}.slotnum{margin-bottom:7px;color:#38bdf8;font-size:10px;font-weight:900}.slot.over{border-color:#38bdf8;background:rgba(56,189,248,.17)}.slot.correct{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.14)}.slot.wrong{border-style:solid;border-color:#ef4444;background:rgba(239,68,68,.14)}.poolbox{padding:14px;border:1px solid #334155;border-radius:9px;background:#0f172a}.pooltitle{margin-bottom:10px;color:#f59e0b;font-size:11px;font-weight:850;text-transform:uppercase}.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:75px}.card{width:100%;padding:9px 7px;border-radius:7px;background:#0284c7;color:#fff;text-align:center;font-size:11px;font-weight:850;cursor:grab;box-shadow:0 3px 6px rgba(0,0,0,.2)}.pool .card{flex:1 1 calc(14% - 8px);min-width:105px;width:auto}.card small{display:block;margin-top:3px;color:#e0f2fe;font-size:9px;font-weight:500}.card.selected{outline:4px solid #f59e0b;background:#075f93}.card.dragging{opacity:.4}.hint{text-align:center;margin:9px 0 0;color:#94a3b8;font-size:10px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}button{padding:10px 20px;border:0;border-radius:7px;color:#fff;font-weight:800;cursor:pointer}.check{background:#0284c7}.reset{background:#64748b}.result{font-size:13px;font-weight:850}@media(max-width:780px){body{padding:7px}.game{padding:11px}.timeline{grid-template-columns:repeat(2,1fr)}.slot{min-height:86px}h1{font-size:17px}}
</style>
</head>
<body>
<main class="game"><h1>Quy trình tư duy thiết kế STEM</h1><p class="subtitle">Sắp xếp đúng bảy bước từ xác định nhu cầu đến chia sẻ giải pháp.</p><section class="timeline" id="timeline"></section><section class="poolbox"><div class="pooltitle">Các bước thực hiện đã xáo trộn</div><div class="pool" id="pool"></div><p class="hint">Kéo–thả, hoặc nhấp chọn thẻ rồi nhấp vào vị trí muốn đặt.</p></section><div class="controls"><button class="check" id="check">Kiểm tra kết quả</button><button class="reset" id="reset">Làm lại</button><span class="result" id="result" aria-live="polite"></span></div></main>
<script>
const sequence=[{code:'ASK',desc:'Xác định nhu cầu'},{code:'SKETCH',desc:'Phác thảo'},{code:'MAKE',desc:'Thiết kế Tinkercad'},{code:'PRINT',desc:'In mẫu'},{code:'TEST',desc:'Thử nghiệm'},{code:'IMPROVE',desc:'Cải tiến'},{code:'SHARE',desc:'Chia sẻ'}];const timeline=document.getElementById('timeline'),pool=document.getElementById('pool'),result=document.getElementById('result');let dragged=null,selected=null,reported=false;function choose(card){document.querySelectorAll('.card.selected').forEach(x=>x.classList.remove('selected'));selected=card;card?.classList.add('selected')}function makeCard(item){const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.code=item.code;card.innerHTML=`${item.code}<small>${item.desc}</small>`;card.onclick=event=>{event.stopPropagation();choose(selected===card?null:card)};card.ondragstart=event=>{dragged=card;card.classList.add('dragging');event.dataTransfer.setData('text/plain',item.code)};card.ondragend=()=>{card.classList.remove('dragging');dragged=null};return card}function place(slot,card){if(!card)return;const old=slot.querySelector('.card');if(old)pool.appendChild(old);slot.appendChild(card);slot.classList.remove('correct','wrong');choose(null)}
function init(){timeline.innerHTML='';pool.innerHTML='';result.textContent='';reported=false;choose(null);for(let i=0;i<7;i++){const slot=document.createElement('div');slot.className='slot';slot.dataset.index=i;slot.innerHTML=`<span class="slotnum">BƯỚC ${i+1}</span>`;slot.ondragover=event=>{event.preventDefault();slot.classList.add('over')};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=event=>{event.preventDefault();slot.classList.remove('over');place(slot,dragged)};slot.onclick=()=>place(slot,selected);timeline.appendChild(slot)}const shuffled=[...sequence];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled.forEach(item=>pool.appendChild(makeCard(item)))}pool.ondragover=event=>event.preventDefault();pool.ondrop=event=>{event.preventDefault();if(dragged)pool.appendChild(dragged)};pool.onclick=event=>{if(event.target===pool)choose(null)};
document.getElementById('check').onclick=()=>{let correct=0;document.querySelectorAll('.slot').forEach((slot,index)=>{slot.classList.remove('correct','wrong');const card=slot.querySelector('.card'),ok=card?.dataset.code===sequence[index].code;slot.classList.add(ok?'correct':'wrong');if(ok)correct++});result.textContent=correct===7?'Chính xác! Đã hoàn thành đúng quy trình STEM 7/7.':`Hoàn thành ${correct}/7 bước. Kiểm tra lại các ô màu đỏ.`;result.style.color=correct===7?'#22c55e':'#ef6262';if(correct===7&&!reported){reported=true;parent.postMessage({type:'lesson-sim-complete',lesson:12},location.origin)}};document.getElementById('reset').onclick=init;init();
</script>
</body>
</html>
