<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 9 - Quy trình thiết kế và in 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef4f8;color:#0f172a}body{display:flex;justify-content:center;padding:16px}.game{width:min(940px,100%);padding:21px;border-radius:13px;background:#fff;box-shadow:0 5px 22px rgba(0,0,0,.09)}h1{text-align:center;font-size:21px;margin:0 0 5px}.subtitle{text-align:center;margin:0 0 17px;color:#64748b;font-size:13px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:18px}.slot{min-height:92px;display:flex;flex-direction:column;align-items:center;padding:6px;border:2px dashed #cbd5e1;border-radius:8px;background:#f8fafc;transition:.17s}.slotnum{margin-bottom:5px;color:#8495a8;font-size:10px;font-weight:900}.slot.over{border-color:#0284c7;background:#e0f2fe}.slot.correct{border-style:solid;border-color:#22c55e;background:#f0fdf4}.slot.wrong{border-style:solid;border-color:#ef4444;background:#fef2f2}.poolbox{padding:13px;border:1px solid #dbe4eb;border-radius:9px;background:#f8fafc}.pooltitle{margin-bottom:9px;color:#475569;font-size:11px;font-weight:850;text-transform:uppercase}.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:72px}.card{flex:1 1 calc(20% - 8px);min-width:120px;padding:9px 7px;border-radius:7px;background:#0284c7;color:#fff;text-align:center;font-size:11px;font-weight:850;cursor:grab;box-shadow:0 2px 5px rgba(0,0,0,.1)}.card small{display:block;margin-top:3px;font-size:9px;font-weight:500;opacity:.9}.card.selected{outline:4px solid #f59e0b;background:#075f93}.card.dragging{opacity:.4}.hint{text-align:center;margin:9px 0 0;color:#64748b;font-size:10px}.controls{display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;margin-top:15px}button{padding:10px 18px;border:0;border-radius:7px;color:#fff;font-weight:800;cursor:pointer}.check{background:#0284c7}.reset{background:#64748b}.result{font-size:13px;font-weight:850}@media(max-width:720px){body{padding:7px}.game{padding:11px}.timeline{grid-template-columns:repeat(2,1fr)}.slot{min-height:84px}h1{font-size:17px}}
</style>
</head>
<body>
<main class="game"><h1>Quy trình thiết kế và in 3D</h1><p class="subtitle">Sắp xếp các thẻ theo đúng thứ tự từ Bước 1 đến Bước 10.</p><section class="timeline" id="timeline"></section><section class="poolbox"><div class="pooltitle">Thẻ quy trình đã xáo trộn</div><div class="pool" id="pool"></div><p class="hint">Kéo–thả, hoặc nhấp chọn thẻ rồi nhấp vào vị trí muốn đặt.</p></section><div class="controls"><button class="check" id="check">Kiểm tra kết quả</button><button class="reset" id="reset">Làm lại</button><span class="result" id="result" aria-live="polite"></span></div></main>
<script>
const sequence=[{name:'ASK',desc:'Nhu cầu / Yêu cầu'},{name:'SKETCH',desc:'Phác thảo ý tưởng'},{name:'MAKE',desc:'Dựng mô hình 3D'},{name:'CHECK',desc:'Kiểm tra lỗi 3D'},{name:'EXPORT',desc:'Xuất file STL/OBJ'},{name:'SLICE',desc:'Lát cắt bằng Slicer'},{name:'PREVIEW',desc:'Xem trước G-code'},{name:'PRINT',desc:'Tiến hành in 3D'},{name:'TEST',desc:'Thử nghiệm mẫu'},{name:'IMPROVE',desc:'Cải tiến thiết kế'}];const timeline=document.getElementById('timeline'),pool=document.getElementById('pool'),result=document.getElementById('result');let dragged=null,selected=null,reported=false;function choose(card){document.querySelectorAll('.card.selected').forEach(x=>x.classList.remove('selected'));selected=card;card?.classList.add('selected')}
function makeCard(item){const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.name=item.name;card.innerHTML=`${item.name}<small>${item.desc}</small>`;card.onclick=event=>{event.stopPropagation();choose(selected===card?null:card)};card.ondragstart=event=>{dragged=card;card.classList.add('dragging');event.dataTransfer.setData('text/plain',item.name)};card.ondragend=()=>{card.classList.remove('dragging');dragged=null};return card}
function place(slot,card){if(!card)return;const old=slot.querySelector('.card');if(old)pool.appendChild(old);slot.appendChild(card);slot.classList.remove('correct','wrong');choose(null)}function init(){timeline.innerHTML='';pool.innerHTML='';result.textContent='';reported=false;choose(null);for(let i=0;i<10;i++){const slot=document.createElement('div');slot.className='slot';slot.dataset.index=i;slot.innerHTML=`<span class="slotnum">BƯỚC ${i+1}</span>`;slot.ondragover=event=>{event.preventDefault();slot.classList.add('over')};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=event=>{event.preventDefault();slot.classList.remove('over');place(slot,dragged)};slot.onclick=()=>place(slot,selected);timeline.appendChild(slot)}const shuffled=[...sequence];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled.forEach(item=>pool.appendChild(makeCard(item)))}
pool.ondragover=event=>event.preventDefault();pool.ondrop=event=>{event.preventDefault();if(dragged)pool.appendChild(dragged)};pool.onclick=event=>{if(event.target===pool)choose(null)};document.getElementById('check').onclick=()=>{let correct=0;document.querySelectorAll('.slot').forEach((slot,index)=>{slot.classList.remove('correct','wrong');const card=slot.querySelector('.card'),ok=card?.dataset.name===sequence[index].name;slot.classList.add(ok?'correct':'wrong');if(ok)correct++});result.textContent=correct===10?'Hoàn hảo! Đã đúng 10/10 bước.':`Đúng ${correct}/10 bước. Hãy kiểm tra lại các ô màu đỏ.`;result.style.color=correct===10?'#16823a':'#c92f2f';if(correct===10&&!reported){reported=true;parent.postMessage({type:'lesson-sim-complete',lesson:9},location.origin)}};document.getElementById('reset').onclick=init;init();
</script>
</body>
</html>
