<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 8 - Interactive FDM Printer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf1f6;color:#1e293b}body{display:grid;place-items:center;padding:18px}.app{width:min(920px,100%)}h1{text-align:center;margin:0 0 5px;font-size:22px}.lead{text-align:center;margin:0 0 18px;color:#5c7082}.layout{display:grid;grid-template-columns:minmax(390px,1.25fr) minmax(260px,.75fr);gap:18px}.printer{height:500px;position:relative;overflow:hidden;border:2px solid #294960;border-radius:14px;background:linear-gradient(#fafdff,#dbe7ef);box-shadow:0 8px 28px rgba(20,50,70,.15)}.frame{position:absolute;inset:45px 48px 45px;border:16px solid #193c59;border-bottom-width:22px;border-radius:15px}.rail{position:absolute;left:82px;right:82px;top:150px;height:11px;background:#7793a6;box-shadow:0 6px 0 #35556d}.spool{position:absolute;left:25px;top:12px;width:92px;height:92px;border:17px solid #168fc2;border-radius:50%;background:#e8f2f7;box-shadow:inset 0 0 0 8px #294960}.spool:after{content:'FILAMENT';position:absolute;left:65px;top:73px;color:#15617f;font-size:9px;font-weight:900}.filament{position:absolute;left:110px;top:55px;width:calc(50% - 110px);height:78px;border-top:4px solid #16a9d5;border-right:4px solid #16a9d5;border-radius:0 30px 0 0}.extruder{position:absolute;z-index:2;top:132px;left:calc(50% - 31px);width:62px;height:72px;border-radius:7px;background:linear-gradient(#f7b72b,#dd7d0b);box-shadow:0 5px 10px rgba(0,0,0,.2)}.extruder:before{content:'';position:absolute;left:11px;right:11px;top:12px;height:18px;background:#314b5e;border-radius:4px}.nozzle{position:absolute;z-index:2;top:204px;left:calc(50% - 9px);width:18px;height:30px;background:#313f48;clip-path:polygon(18% 0,82% 0,100% 65%,60% 65%,50% 100%,40% 65%,0 65%)}.strand{position:absolute;top:230px;left:calc(50% - 2px);width:4px;height:115px;background:#1fc1dd}.object{position:absolute;left:calc(50% - 55px);bottom:89px;width:110px;height:92px;background:repeating-linear-gradient(to bottom,#17a8c9 0 7px,#087c9c 7px 9px);clip-path:polygon(8% 100%,18% 42%,38% 42%,45% 5%,58% 5%,66% 60%,86% 36%,95% 36%,95% 100%)}.plate{position:absolute;left:82px;right:82px;bottom:72px;height:15px;background:#0879c9;transform:skewX(-9deg);box-shadow:0 8px 0 #7897aa}.hotspot{position:absolute;z-index:4;width:34px;height:34px;border:3px solid #fff;border-radius:50%;background:#e33d45;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.3);transition:.16s}.hotspot:hover,.hotspot:focus{transform:scale(1.14)}.hotspot.done{background:#19a56f}.h1{top:125px;left:calc(50% + 36px)}.h2{top:202px;left:calc(50% + 21px)}.h3{bottom:90px;left:calc(50% + 70px)}.details{display:flex;flex-direction:column;min-height:500px;padding:23px;border:1px solid #c2d2dd;border-radius:14px;background:#fff;box-shadow:0 8px 28px rgba(20,50,70,.12)}.badge{align-self:flex-start;padding:5px 9px;border-radius:99px;background:#e6f5fb;color:#087c9c;font-size:11px;font-weight:850}.details h2{font-size:21px;margin:18px 0 7px}.details p{line-height:1.65;color:#4c6173}.progress{margin-top:auto;padding:12px;border-radius:9px;background:#e8f4fb;color:#145175;font-weight:800}@media(max-width:720px){body{padding:8px}.layout{grid-template-columns:1fr}.printer{height:470px}.details{min-height:250px}h1{font-size:18px}}
</style>
</head>
<body>
<main class="app"><h1>Khám phá máy in 3D FDM</h1><p class="lead">Nhấp vào ba điểm đánh dấu để tìm hiểu cách nhựa nóng chảy tạo thành vật thể.</p><div class="layout">
<section class="printer" aria-label="Sơ đồ máy in 3D FDM"><div class="frame"></div><div class="rail"></div><div class="spool"></div><div class="filament"></div><div class="extruder"></div><div class="nozzle"></div><div class="strand"></div><div class="object"></div><div class="plate"></div><button class="hotspot h1" data-part="extruder" aria-label="Khám phá Extruder và Hotend">1</button><button class="hotspot h2" data-part="nozzle" aria-label="Khám phá Nozzle">2</button><button class="hotspot h3" data-part="plate" aria-label="Khám phá Build Plate">3</button></section>
<aside class="details"><span class="badge">BỘ PHẬN MÁY IN</span><h2 id="title">Nhấp vào số trên hình</h2><p id="description">Chọn một bộ phận trên sơ đồ máy in 3D FDM để xem cấu tạo và chức năng.</p><div class="progress" id="progress" aria-live="polite">Đã khám phá 0/3 bộ phận.</div></aside>
</div></main>
<script>
const info={extruder:{title:'Extruder & Hotend',description:'Bộ đẩy nhựa kéo filament xuống. Hotend nung vật liệu đến nhiệt độ thích hợp để nhựa nóng chảy và có thể đi qua đầu phun.'},nozzle:{title:'Nozzle · Đầu phun',description:'Lỗ nhỏ, thường có đường kính 0,4 mm, đưa sợi nhựa nóng chảy ra ngoài và xếp vật liệu thành từng đường trên mỗi lớp.'},plate:{title:'Build Plate · Bàn in',description:'Bề mặt nơi vật thể được tạo theo từng lớp. Bàn in có thể được gia nhiệt để lớp đầu bám chắc và hạn chế cong vênh.'}};const explored=new Set(),title=document.getElementById('title'),description=document.getElementById('description'),progress=document.getElementById('progress');document.querySelectorAll('.hotspot').forEach(button=>button.onclick=()=>{const part=button.dataset.part;explored.add(part);button.classList.add('done');button.textContent='✓';title.textContent=info[part].title;description.textContent=info[part].description;progress.textContent=explored.size===3?'✓ Hoàn thành: đã khám phá đủ ba bộ phận.':`Đã khám phá ${explored.size}/3 bộ phận.`;if(explored.size===3)parent.postMessage({type:'lesson-sim-complete',lesson:8},location.origin)});
</script>
</body>
</html>
