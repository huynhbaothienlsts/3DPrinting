<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 11 - 3D Print Doctor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#f8fafc}body{padding:14px}.game{max-width:1180px;margin:auto;padding:20px;border:1px solid #334155;border-radius:13px;background:#1e293b;box-shadow:0 10px 30px rgba(0,0,0,.3)}h1{text-align:center;margin:0 0 5px;color:#38bdf8;font-size:21px;text-transform:uppercase;letter-spacing:.06em}.subtitle{text-align:center;margin:0 0 16px;color:#9aacbf;font-size:13px}.tablewrap{overflow-x:auto}table{width:100%;min-width:800px;border-collapse:collapse;margin-bottom:18px;background:#0f172a}th{width:25%;padding:10px 7px;border:1px solid #334155;background:#0284c7;font-size:12px}td{width:25%;padding:6px;border:1px solid #334155;vertical-align:top}.rowhead{text-align:center;vertical-align:middle;color:#f59e0b;font-size:13px;font-weight:850;background:#1e293b;border-right:2px solid #0284c7}.rowhead small{display:block;color:#cbd5e1;font-weight:500}.zone{min-height:75px;display:flex;align-items:center;justify-content:center;padding:5px;border:2px dashed #475569;border-radius:7px;background:rgba(30,41,59,.55);transition:.17s}.zone.over{border-color:#38bdf8;background:rgba(56,189,248,.18)}.zone.correct{border-style:solid;border-color:#22c55e;background:rgba(34,197,94,.14)}.zone.wrong{border-style:solid;border-color:#ef4444;background:rgba(239,68,68,.14)}.poolbox{padding:13px;border:1px solid #334155;border-radius:9px;background:#0f172a}.pooltitle{margin-bottom:9px;color:#38bdf8;font-size:11px;font-weight:850;text-transform:uppercase}.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:90px}.card{flex:1 1 calc(25% - 8px);min-width:190px;padding:9px 10px;border:1px solid #475569;border-left:4px solid #38bdf8;border-radius:6px;background:#334155;color:#f8fafc;font-size:11px;line-height:1.4;cursor:grab;box-shadow:0 3px 6px rgba(0,0,0,.2)}.card.selected{outline:3px solid #f59e0b;background:#40536b}.card.dragging{opacity:.4}.hint{text-align:center;margin:9px 0 0;color:#94a3b8;font-size:10px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}button{padding:10px 20px;border:0;border-radius:7px;color:#fff;font-weight:800;cursor:pointer}.check{background:#0284c7}.reset{background:#64748b}.score{font-size:13px;font-weight:850}@media(max-width:600px){body{padding:6px}.game{padding:10px}h1{font-size:17px}.card{min-width:150px}}
</style>
</head>
<body>
<main class="game"><h1>3D Print Doctor</h1><p class="subtitle">Ghép đúng dấu hiệu, nguyên nhân và cách xử lý cho từng lỗi in 3D.</p><div class="tablewrap"><table><thead><tr><th>Tên lỗi in</th><th>Dấu hiệu nhận biết</th><th>Nguyên nhân chính</th><th>Cách xử lý / Cải tiến</th></tr></thead><tbody>
<tr><td class="rowhead">Warping<small>Cong vênh</small></td><td><div class="zone" data-target="r1c1"></div></td><td><div class="zone" data-target="r1c2"></div></td><td><div class="zone" data-target="r1c3"></div></td></tr>
<tr><td class="rowhead">Stringing<small>Tơ nhựa</small></td><td><div class="zone" data-target="r2c1"></div></td><td><div class="zone" data-target="r2c2"></div></td><td><div class="zone" data-target="r2c3"></div></td></tr>
<tr><td class="rowhead">Under-extrusion</td><td><div class="zone" data-target="r3c1"></div></td><td><div class="zone" data-target="r3c2"></div></td><td><div class="zone" data-target="r3c3"></div></td></tr>
<tr><td class="rowhead">Layer Shifting</td><td><div class="zone" data-target="r4c1"></div></td><td><div class="zone" data-target="r4c2"></div></td><td><div class="zone" data-target="r4c3"></div></td></tr>
</tbody></table></div><section class="poolbox"><div class="pooltitle">Thẻ chẩn đoán đã xáo trộn</div><div class="pool" id="pool"></div><p class="hint">Kéo–thả, hoặc nhấp chọn thẻ rồi nhấp vào ô muốn đặt.</p></section><div class="controls"><button class="check" id="check">Kiểm tra chẩn đoán</button><button class="reset" id="reset">Làm lại</button><span class="score" id="score" aria-live="polite"></span></div></main>
<script>
const cards=[{id:'r1c1',text:'Góc đáy sản phẩm bị cong, bóc khỏi bàn in'},{id:'r1c2',text:'Bàn in thiếu bám dính, chênh lệch nhiệt độ'},{id:'r1c3',text:'Dùng keo dán bàn, bật Brim và vệ sinh bàn in'},{id:'r2c1',text:'Sợi tơ nhựa giăng như mạng nhện giữa các cột'},{id:'r2c2',text:'Nhiệt độ quá cao hoặc Retraction chưa chuẩn'},{id:'r2c3',text:'Giảm nhiệt độ Hotend 5°C, tăng khoảng cách Retraction'},{id:'r3c1',text:'Mẫu in thưa, thiếu nhựa, có khoảng hở giữa các đường'},{id:'r3c2',text:'Nozzle nghẹt hoặc bánh răng Extruder bị trượt'},{id:'r3c3',text:'Vệ sinh hoặc thay Nozzle, kiểm tra filament không bị kẹt'},{id:'r4c1',text:'Vật thể bị xô lệch thành nấc theo trục ngang'},{id:'r4c2',text:'Dây curoa trùng hoặc động cơ gặp vật cản'},{id:'r4c3',text:'Siết dây curoa, kiểm tra hành trình cơ khí'}];const pool=document.getElementById('pool'),zones=[...document.querySelectorAll('.zone')],score=document.getElementById('score');let dragged=null,selected=null,reported=false;function choose(card){document.querySelectorAll('.card.selected').forEach(x=>x.classList.remove('selected'));selected=card;card?.classList.add('selected')}function makeCard(data){const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.id=data.id;card.textContent=data.text;card.onclick=event=>{event.stopPropagation();choose(selected===card?null:card)};card.ondragstart=event=>{dragged=card;card.classList.add('dragging');event.dataTransfer.setData('text/plain',data.id)};card.ondragend=()=>{card.classList.remove('dragging');dragged=null};return card}function place(zone,card){if(!card)return;if(zone.firstElementChild)pool.appendChild(zone.firstElementChild);zone.appendChild(card);zone.classList.remove('correct','wrong');choose(null)}
function init(){pool.innerHTML='';zones.forEach(zone=>{zone.innerHTML='';zone.classList.remove('correct','wrong','over')});score.textContent='';reported=false;choose(null);const shuffled=[...cards];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled.forEach(data=>pool.appendChild(makeCard(data)))}zones.forEach(zone=>{zone.ondragover=event=>{event.preventDefault();zone.classList.add('over')};zone.ondragleave=()=>zone.classList.remove('over');zone.ondrop=event=>{event.preventDefault();zone.classList.remove('over');place(zone,dragged)};zone.onclick=()=>place(zone,selected)});pool.ondragover=event=>event.preventDefault();pool.ondrop=event=>{event.preventDefault();if(dragged)pool.appendChild(dragged)};pool.onclick=event=>{if(event.target===pool)choose(null)};
document.getElementById('check').onclick=()=>{let correct=0;zones.forEach(zone=>{zone.classList.remove('correct','wrong');const item=zone.querySelector('.card'),ok=item?.dataset.id===zone.dataset.target;zone.classList.add(ok?'correct':'wrong');if(ok)correct++});score.textContent=`Chẩn đoán đúng: ${correct}/12 mục`;score.style.color=correct===12?'#22c55e':'#ef6262';if(correct===12&&!reported){reported=true;parent.postMessage({type:'lesson-sim-complete',lesson:11},location.origin)}};document.getElementById('reset').onclick=init;init();
</script>
</body>
</html>
