<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 10 - Slicer Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eaf1f6;color:#1e293b}body{display:grid;place-items:center;padding:17px}.sim{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 7px 28px rgba(20,50,70,.14)}.panel{padding:23px}.controls{border-right:1px solid #d7e2ea;background:#fafdff}h1{font-size:19px;margin:0 0 17px}.group{margin-bottom:19px}label{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:13px;font-weight:800}.value{color:#0879c9}input[type=range],select{width:100%;accent-color:#0879c9}select{padding:8px;border:1px solid #b8cbd8;border-radius:7px;background:#fff}.preview{height:190px;position:relative;display:grid;place-items:center;margin-bottom:15px;border-radius:12px;background:linear-gradient(145deg,#092c4a,#0e5877);overflow:hidden}.model{width:145px;height:135px;border:2px solid #e8fbff;border-radius:9px 9px 3px 3px;box-shadow:0 12px 0 #6e91a5;background-color:#18a5c8}.nozzle{position:absolute;top:13px;left:calc(50% - 15px);width:30px;height:38px;background:#f0a51d;clip-path:polygon(0 0,100% 0,75% 72%,58% 72%,50% 100%,42% 72%,25% 72%)}.metric{margin-bottom:9px;padding:10px 12px;border-left:4px solid #0879c9;border-radius:5px;background:#f1f6f9;font-size:12px}.metric b{float:right;color:#0d4c70}.note{font-size:10px;color:#6b7c89;font-style:italic}.progress{margin-top:14px;padding:10px;border-radius:8px;background:#e8f4fb;color:#145175;font-size:11px;font-weight:800}@media(max-width:680px){body{padding:7px}.sim{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #d7e2ea}.panel{padding:15px}.preview{height:160px}.model{height:110px}}
</style>
</head>
<body>
<main class="sim"><section class="panel controls"><h1>Cấu hình Slicing</h1><div class="group"><label for="layer">Layer Height <span class="value"><span id="layerVal">0,20</span> mm</span></label><input type="range" id="layer" min="0.1" max="0.3" step="0.05" value="0.2"></div><div class="group"><label for="infill">Infill <span class="value"><span id="infillVal">20</span>%</span></label><input type="range" id="infill" min="0" max="100" step="10" value="20"></div><div class="group"><label for="support">Support Structure</label><select id="support"><option value="0">Tắt · OFF</option><option value="1.3">Bật · ON</option></select></div><div class="progress" id="progress" aria-live="polite">Đã thử 0/3 nhóm thiết lập.</div></section>
<section class="panel"><h1>Dự đoán kết quả</h1><div class="preview"><div class="nozzle"></div><div class="model" id="model"></div></div><div class="metric">Thời gian in ước tính <b id="time">2h 40m</b></div><div class="metric">Lượng nhựa tiêu thụ <b id="material">23 g</b></div><div class="metric">Chất lượng bề mặt <b id="quality">Trung bình</b></div><div class="metric">Độ chịu lực <b id="strength">Khá</b></div><p class="note">Đây là mô phỏng giáo dục. Kết quả thực tế còn phụ thuộc máy in, nozzle, vật liệu và profile in.</p></section></main>
<script>
const layer=document.getElementById('layer'),infill=document.getElementById('infill'),support=document.getElementById('support'),used=new Set(),progress=document.getElementById('progress');let reported=false;function update(){const l=+layer.value,inf=+infill.value,sup=+support.value;document.getElementById('layerVal').textContent=l.toFixed(2).replace('.',',');document.getElementById('infillVal').textContent=inf;const minutes=Math.round(((1/l)*30+inf*.5)*(sup||1));document.getElementById('time').textContent=`${Math.floor(minutes/60)}h ${minutes%60}m`;document.getElementById('material').textContent=`${Math.round(15+inf*.4+(sup?12:0))} g`;document.getElementById('quality').textContent=l<=.12?'Mịn · Rất cao':l<=.2?'Trung bình':'Thô · Nấc rõ';document.getElementById('strength').textContent=inf>=50?'Rất cao':inf>=20?'Khá':'Yếu · Dễ vỡ';const layerGap=Math.max(3,Math.round(l*35)),infillGap=Math.max(7,24-Math.round(inf/6));document.getElementById('model').style.backgroundImage=`repeating-linear-gradient(0deg,transparent 0 ${layerGap-1}px,rgba(6,69,94,.8) ${layerGap}px ${layerGap+1}px),repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px ${infillGap}px)`;progress.textContent=used.size===3?'✓ Hoàn thành: đã thử Layer Height, Infill và Support.':`Đã thử ${used.size}/3 nhóm thiết lập.`;if(used.size===3&&!reported){reported=true;parent.postMessage({type:'lesson-sim-complete',lesson:10},location.origin)}}layer.oninput=()=>{used.add('layer');update()};infill.oninput=()=>{used.add('infill');update()};support.onchange=()=>{used.add('support');update()};update();
</script>
</body>
</html>
