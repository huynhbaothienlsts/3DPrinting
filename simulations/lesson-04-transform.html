<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinkercad Transform Simulator</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#dce3ea;user-select:none}#canvas{width:100%;height:100%}.inspector{position:absolute;z-index:5;top:14px;right:14px;width:260px;padding:15px;border:1px solid #b7c8d4;border-radius:11px;background:rgba(255,255,255,.95);box-shadow:0 6px 24px rgba(0,0,0,.16)}h1{font-size:14px;color:#253b50;border-bottom:2px solid #0879c9;padding-bottom:7px;margin:0 0 10px;text-transform:uppercase}.input{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:12px;color:#455b6d;font-weight:700}.input input{width:78px;padding:5px;border:1px solid #bccbd6;border-radius:5px;color:#0879c9;font-weight:800;text-align:right}.legend{position:absolute;z-index:5;left:14px;bottom:14px;max-width:330px;padding:12px 15px;border-radius:10px;background:rgba(255,255,255,.94);box-shadow:0 5px 18px rgba(0,0,0,.12);font-size:11px;line-height:1.6;color:#314b60}.legend b{color:#132f46}.status{margin-top:9px;padding:8px;border-radius:6px;background:#e8f4fb;color:#145175}.indicator{position:absolute;z-index:6;top:14px;left:14px;display:none;padding:7px 11px;border-radius:5px;background:#172b3d;color:#65f0cd;font:12px Consolas,monospace}.error{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#17334d;color:#fff}@media(max-width:650px){.inspector{top:8px;right:8px;width:190px;padding:10px}.legend{left:8px;bottom:8px;max-width:220px;font-size:9px}.input{font-size:10px}.input input{width:62px}.indicator{top:8px;left:8px}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script></head><body>
<div id="canvas"></div><aside class="inspector"><h1>Kích thước (mm)</h1><label class="input">Chiều dài X<input type="number" id="dimX" min="2" max="150" value="30"></label><label class="input">Chiều rộng Y<input type="number" id="dimY" min="2" max="150" value="30"></label><label class="input">Chiều cao Z<input type="number" id="dimZ" min="2" max="150" value="20"></label><label class="input">Nâng sàn Z<input type="number" id="posZ" min="0" max="100" value="0"></label><div class="status" id="status">Hãy di chuyển, đổi kích thước, nâng Z và xoay vật thể.</div></aside>
<div class="legend"><b>Nhận diện tay nắm</b><br>▲ Nón đen: nâng/hạ Z · □ Trắng góc: đổi X/Y · ■ Đen cạnh: đổi một chiều · □ Trắng trên: đổi cao Z · ◯ Vòng xanh: xoay</div><div class="indicator" id="indicator"></div><div class="error" id="error">Không tải được thư viện 3D. Hãy kiểm tra mạng rồi tải lại.</div>
<script>
if(!window.THREE){document.getElementById('error').style.display='grid';throw new Error('Three.js unavailable')}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdce3ea);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(60,60,80);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('canvas').appendChild(renderer.domElement);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.01;scene.add(new THREE.GridHelper(200,20,0x0078d4,0xb0c4de));scene.add(new THREE.AmbientLight(0xffffff,.7));const light=new THREE.DirectionalLight(0xffffff,.55);light.position.set(80,150,80);light.castShadow=true;scene.add(light);
let size={x:30,y:30,z:20},elevation=0,angle=0;const completed=new Set,group=new THREE.Group();scene.add(group);const main=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xef4444}));main.castShadow=true;group.add(main);const gizmos=new THREE.Group();group.add(gizmos);const handles=[];const white=new THREE.MeshBasicMaterial({color:0xffffff}),black=new THREE.MeshBasicMaterial({color:0x222222}),blue=new THREE.MeshBasicMaterial({color:0x0078d4,side:THREE.DoubleSide});function handle(geo,mat,type){let m=new THREE.Mesh(geo,mat);m.userData.type=type;gizmos.add(m);handles.push(m);return m}const cubeGeo=new THREE.BoxGeometry(2.5,2.5,2.5),cone=handle(new THREE.ConeGeometry(2,4,16),black,'ELEVATE'),top=handle(cubeGeo,white,'HEIGHT'),corners=[0,1,2,3].map(i=>handle(cubeGeo,white,'CORNER'+i)),edges=[0,1,2,3].map(i=>handle(cubeGeo,black,'EDGE'+i)),ring=handle(new THREE.RingGeometry(18,19,40).rotateX(Math.PI/2),blue,'ROTATE');
const ids={x:document.getElementById('dimX'),y:document.getElementById('dimY'),z:document.getElementById('dimZ'),e:document.getElementById('posZ')},indicator=document.getElementById('indicator'),status=document.getElementById('status');function check(){status.textContent=completed.size===4?'✓ Hoàn thành: đã di chuyển, thay đổi kích thước, nâng và xoay.':`Đã hoàn thành ${completed.size}/4 nhóm thao tác`;if(completed.size===4)parent.postMessage({type:'lesson-sim-complete',lesson:4},location.origin)}function update(){main.scale.set(size.x,size.z,size.y);main.position.y=size.z/2;group.position.y=elevation;group.rotation.y=angle;let hx=size.x/2,hy=size.y/2;cone.position.set(0,size.z+8,0);top.position.set(0,size.z,0);[[hx,0,hy],[-hx,0,hy],[-hx,0,-hy],[hx,0,-hy]].forEach((p,i)=>corners[i].position.set(...p));[[hx,0,0],[-hx,0,0],[0,0,hy],[0,0,-hy]].forEach((p,i)=>edges[i].position.set(...p));ring.position.y=.2;ids.x.value=Math.round(size.x);ids.y.value=Math.round(size.y);ids.z.value=Math.round(size.z);ids.e.value=Math.round(elevation)}update();
Object.entries(ids).forEach(([k,input])=>input.addEventListener('input',()=>{let v=Math.max(k==='e'?0:2,+input.value||0);if(k==='x'||k==='y'||k==='z'){size[k]=v;completed.add('size')}else{elevation=v;completed.add('elevate')}update();check()}));
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(),start=new THREE.Vector3(),point=new THREE.Vector3();let active=null,drag=false,initialSize,initialElevation,initialAngle,initialX,initialZ;function pointer(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera)}addEventListener('pointerdown',e=>{if(e.clientX>innerWidth-290&&e.clientY<230)return;pointer(e);let hit=ray.intersectObjects(handles);if(hit.length){active=hit[0].object.userData.type;plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(),hit[0].point)}else{hit=ray.intersectObject(main);if(!hit.length)return;active='MOVE';plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0,1,0),hit[0].point)}drag=true;controls.enabled=false;ray.ray.intersectPlane(plane,start);initialSize={...size};initialElevation=elevation;initialAngle=angle;initialX=group.position.x;initialZ=group.position.z});addEventListener('pointermove',e=>{if(!drag)return;pointer(e);if(!ray.ray.intersectPlane(plane,point))return;let d=point.clone().sub(start);if(active==='MOVE'){group.position.x=initialX+d.x;group.position.z=initialZ+d.z;completed.add('move');indicator.textContent=`Vị trí: X ${group.position.x.toFixed(1)}, Y ${group.position.z.toFixed(1)}`}else if(active==='ELEVATE'){elevation=Math.max(0,initialElevation+d.y);completed.add('elevate');indicator.textContent=`Nâng Z: ${elevation.toFixed(1)} mm`}else if(active==='HEIGHT'){size.z=Math.max(2,initialSize.z+d.y);completed.add('size');indicator.textContent=`Cao Z: ${size.z.toFixed(1)} mm`}else if(active.startsWith('CORNER')){size.x=Math.max(2,initialSize.x+d.x);size.y=Math.max(2,initialSize.y+d.z);completed.add('size')}else if(active.startsWith('EDGE')){if(active==='EDGE0'||active==='EDGE1')size.x=Math.max(2,initialSize.x+d.x);else size.y=Math.max(2,initialSize.y+d.z);completed.add('size')}else if(active==='ROTATE'){angle=initialAngle+d.x*.04;completed.add('rotate');indicator.textContent=`Xoay: ${Math.round(angle*180/Math.PI)}°`}indicator.style.display='block';update();check()});addEventListener('pointerup',()=>{drag=false;active=null;controls.enabled=true;indicator.style.display='none'});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
