<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 5 - Solid, Hole & Group Simulator</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#edf3f8;color:#17324b}#canvas{width:100%;height:100%}.panel{position:absolute;z-index:5;top:14px;left:14px;width:245px;padding:16px;border:1px solid #b8cad8;border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 8px 28px rgba(16,45,70,.18)}h1{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #0879c9}.step{width:100%;margin:0 0 8px;padding:9px 10px;border:0;border-radius:8px;background:#1877e8;color:#fff;font-weight:800;cursor:pointer}.step:hover{filter:brightness(1.08)}.step:disabled{cursor:not-allowed;opacity:.55}.reset{background:#53697b}.info{font-size:12px;line-height:1.55;color:#53697b}.status{margin-top:10px;padding:9px;border-radius:8px;background:#e8f4fb;color:#145175;font-size:12px;font-weight:700}.error{position:absolute;inset:0;display:none;place-items:center;padding:30px;text-align:center;background:#17334d;color:#fff}@media(max-width:600px){.panel{top:8px;left:8px;width:205px;padding:11px}h1{font-size:13px}.step{font-size:11px;padding:7px}.info,.status{font-size:10px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="canvas"></div>
<aside class="panel">
  <h1>THAO TÁC KHỐI</h1>
  <button class="step" id="toggleHoleBtn">1. Đổi trụ thành Hole</button>
  <button class="step" id="alignBtn">2. Align căn giữa X/Y</button>
  <button class="step" id="groupBtn">3. Group để cắt lỗ</button>
  <button class="step reset" id="resetBtn">Làm lại từ đầu</button>
  <div class="info">■ Khối đỏ: Solid (đế)<br>● Khối xanh/xám: Solid hoặc Hole (trụ)<br>Kéo chuột ngoài bảng để xoay góc nhìn.</div>
  <div class="status" id="status">Bước 1/3: đổi khối trụ thành Hole.</div>
</aside>
<div class="error" id="error">Không tải được thư viện 3D. Hãy kiểm tra mạng rồi tải lại trang.</div>
<script>
if(!window.THREE||!THREE.OrbitControls){document.getElementById('error').style.display='grid';throw new Error('Three.js unavailable')}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xedf3f8);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(15,14,20);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('canvas').appendChild(renderer.domElement);const orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,2,0);scene.add(new THREE.GridHelper(24,24,0x0879c9,0xb8cad8));scene.add(new THREE.AmbientLight(0xffffff,.65));const light=new THREE.DirectionalLight(0xffffff,.75);light.position.set(10,20,10);light.castShadow=true;scene.add(light);
const boxGeo=new THREE.BoxGeometry(8,4,8),boxMat=new THREE.MeshLambertMaterial({color:0xef4444}),boxMesh=new THREE.Mesh(boxGeo,boxMat);boxMesh.position.set(0,2,0);boxMesh.castShadow=true;scene.add(boxMesh);const cylGeo=new THREE.CylinderGeometry(2,2,6,40),holeMat=new THREE.MeshLambertMaterial({color:0x718096,transparent:true,opacity:.55,wireframe:true}),solidMat=new THREE.MeshLambertMaterial({color:0x3b82f6}),cylMesh=new THREE.Mesh(cylGeo,solidMat);cylMesh.position.set(3,3,3);cylMesh.castShadow=true;scene.add(cylMesh);
const toggleBtn=document.getElementById('toggleHoleBtn'),alignBtn=document.getElementById('alignBtn'),groupBtn=document.getElementById('groupBtn'),status=document.getElementById('status');let isHole=false,aligned=false,isGrouped=false,groupedResult=null;
toggleBtn.onclick=()=>{if(isGrouped)return;isHole=!isHole;cylMesh.material=isHole?holeMat:solidMat;toggleBtn.textContent=isHole?'✓ Trụ đang là Hole':'1. Đổi trụ thành Hole';aligned=false;status.textContent=isHole?'Bước 2/3: dùng Align để căn Hole vào giữa đế.':'Bước 1/3: đổi khối trụ thành Hole.'};
alignBtn.onclick=()=>{if(isGrouped)return;if(!isHole){status.textContent='Hãy đổi khối trụ thành Hole trước khi Align.';return}cylMesh.position.x=boxMesh.position.x;cylMesh.position.z=boxMesh.position.z;aligned=true;alignBtn.textContent='✓ Đã Align căn giữa';status.textContent='Bước 3/3: nhấn Group để tạo lỗ xuyên qua đế.'};
groupBtn.onclick=()=>{if(isGrouped)return;if(!isHole){status.textContent='Chưa thể Group: khối trụ vẫn là Solid.';return}if(!aligned){status.textContent='Chưa thể Group: hãy Align Hole vào giữa trước.';return}scene.remove(boxMesh,cylMesh);const shape=new THREE.Shape();shape.moveTo(-4,-4);shape.lineTo(4,-4);shape.lineTo(4,4);shape.lineTo(-4,4);shape.closePath();const holePath=new THREE.Path();holePath.absarc(0,0,2,0,Math.PI*2,true);shape.holes.push(holePath);const cutGeo=new THREE.ExtrudeGeometry(shape,{depth:4,bevelEnabled:false,curveSegments:40});cutGeo.rotateX(-Math.PI/2);groupedResult=new THREE.Mesh(cutGeo,boxMat);groupedResult.castShadow=true;scene.add(groupedResult);isGrouped=true;toggleBtn.disabled=alignBtn.disabled=groupBtn.disabled=true;groupBtn.textContent='✓ Group hoàn thành';status.textContent='✓ Hoàn thành: Solid − Hole đã tạo lỗ xuyên tâm.';parent.postMessage({type:'lesson-sim-complete',lesson:5},location.origin)};
document.getElementById('resetBtn').onclick=()=>{if(groupedResult){scene.remove(groupedResult);groupedResult.geometry.dispose();groupedResult=null}scene.add(boxMesh,cylMesh);cylMesh.position.set(3,3,3);cylMesh.material=solidMat;isHole=aligned=isGrouped=false;toggleBtn.disabled=alignBtn.disabled=groupBtn.disabled=false;toggleBtn.textContent='1. Đổi trụ thành Hole';alignBtn.textContent='2. Align căn giữa X/Y';groupBtn.textContent='3. Group để cắt lỗ';status.textContent='Bước 1/3: đổi khối trụ thành Hole.'};
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
