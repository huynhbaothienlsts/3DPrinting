<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tinkercad Practice Mode</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Tahoma,sans-serif;background:#dfe8ef}#canvas{width:100%;height:100%}.panel{position:absolute;z-index:5;top:14px;left:14px;width:min(260px,calc(100% - 28px));padding:16px;border:1px solid #b7c8d5;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 8px 28px rgba(20,45,65,.2)}h1{font-size:16px;color:#17334d;margin:0 0 12px}.add{width:100%;padding:10px;border:0;border-radius:7px;background:#0879c9;color:#fff;font-weight:800;cursor:pointer}.add:hover{background:#075c99}.help{font-size:12px;line-height:1.5;color:#536879;margin-top:12px}.status{padding:9px;margin-top:10px;border-radius:7px;background:#e8f4fb;color:#145175;font-size:12px;font-weight:700}.error{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#17334d;color:#fff}@media(max-width:560px){.panel{top:8px;left:8px;width:205px;padding:11px}.help{font-size:10px}.add{font-size:11px;padding:8px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<aside class="panel"><h1>TINKERCAD PRACTICE</h1><button class="add" id="add">+ Thêm khối lập phương</button><div class="help"><b>Góc nhìn</b><br>• Chuột trái + kéo: xoay 3D<br>• Chuột phải + kéo: pan<br>• Cuộn chuột: zoom<br><br><b>Thao tác:</b> nhấp vào khối để chọn; khối được chọn chuyển màu vàng.</div><div class="status" id="status">Bước 1/2: hãy thêm một khối.</div></aside>
<div id="canvas"></div><div class="error" id="error">Không tải được thư viện 3D. Hãy kiểm tra kết nối mạng rồi tải lại trang.</div>
<script>
if(!window.THREE){document.getElementById('error').style.display='grid';throw new Error('Three.js unavailable')}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdfe8ef);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(20,20,25);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('canvas').appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.05;controls.maxPolarAngle=Math.PI/2-.01;
const grid=new THREE.GridHelper(30,30,0x0078d4,0xaaaaaa);scene.add(grid);const planeGeo=new THREE.PlaneGeometry(30,30);planeGeo.rotateX(-Math.PI/2);const plane=new THREE.Mesh(planeGeo,new THREE.ShadowMaterial({opacity:.15}));plane.receiveShadow=true;scene.add(plane);scene.add(new THREE.AmbientLight(0xffffff,.65));const light=new THREE.DirectionalLight(0xffffff,.7);light.position.set(20,40,20);light.castShadow=true;scene.add(light);
const objects=[];let selected=null,added=false,chosen=false;const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),status=document.getElementById('status');
function update(){status.textContent=added?(chosen?'✓ Hoàn thành: đã thêm và chọn khối.':'Bước 2/2: nhấp vào khối để chọn.'):'Bước 1/2: hãy thêm một khối.';if(added&&chosen)parent.postMessage({type:'lesson-sim-complete',lesson:3},location.origin)}
document.getElementById('add').onclick=()=>{let size=4,cube=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),new THREE.MeshLambertMaterial({color:0xef4444}));cube.castShadow=true;cube.receiveShadow=true;cube.position.set((Math.random()-.5)*14,size/2,(Math.random()-.5)*14);scene.add(cube);objects.push(cube);added=true;update()};
renderer.domElement.addEventListener('pointerdown',e=>{let rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);let hit=raycaster.intersectObjects(objects);if(selected){selected.material.color.setHex(0xef4444);selected=null}if(hit.length){selected=hit[0].object;selected.material.color.setHex(0xf59e0b);chosen=true;update()}});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
